name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & verify (unit + driver smoke + Postgres/Firebird Testcontainer ITs)
        run: mvn -B -ntp verify

      - name: Smoke-check the fat JAR
        run: |
          test -f target/data-bridge.jar
          # Version comes from build-info.properties shaded into the JAR
          # (filtered from pom.xml at build time). Reading it back from the
          # JAR proves three things at once: (1) shade kept the resource,
          # (2) the resource was filtered, (3) BuildInfo loads it correctly.
          EXPECTED_VERSION=$(unzip -p target/data-bridge.jar build-info.properties \
                             | sed -n 's/^version=//p')
          EXPECTED="singularidade-data-bridge ${EXPECTED_VERSION}"
          OUT=$(java -jar target/data-bridge.jar version)
          echo "  expected: $EXPECTED"
          echo "  got:      $OUT"
          if [ "$OUT" != "$EXPECTED" ]; then
              echo "::error::JAR version output mismatch"
              exit 1
          fi

      - name: Smoke-check the catalog JAR (no free-form query)
        run: |
          test -f target/data-bridge-catalog.jar
          OUT=$(java -jar target/data-bridge-catalog.jar version)
          echo "  got: $OUT"
          case "$OUT" in
            *" (catalog)") ;;
            *) echo "::error::catalog JAR version output mismatch"; exit 1 ;;
          esac
          if unzip -l target/data-bridge-catalog.jar | grep -q 'databridge/cli/QueryCommand'; then
              echo "::error::QueryCommand is shipped in the catalog JAR"
              exit 1
          fi
          set +e
          java -jar target/data-bridge-catalog.jar query --jdbc-url x --sql 'SELECT 1' >/dev/null 2>&1
          CODE=$?
          set -e
          if [ "$CODE" -ne 2 ]; then
              echo "::error::catalog JAR accepted the query command (exit $CODE)"
              exit 1
          fi

      - name: Upload fat JARs as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: data-bridge-${{ github.sha }}
          path: |
            target/data-bridge.jar
            target/data-bridge-catalog.jar
          retention-days: 14
